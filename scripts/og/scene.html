<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Geist+Mono:wght@500&display=block" rel="stylesheet" />
<style>
  /*
   * OG video scene. Rendered frame-by-frame by scripts/og/render.mjs:
   * every CSS/WAAPI animation is paused and seeked to an exact time per frame,
   * so output is deterministic. Timeline is 7s and fades back to its first
   * frame so the video loops cleanly.
   */
  :root {
    --red: #c72554;
    --pink: #ff4d7d;
    --burgundy: #8b1538;
    --bg: #0a0a0a;
    --text: #f5f5f5;
    --muted: #a0a0a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { font-family: 'DM Sans', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .anim { animation-fill-mode: both; animation-timing-function: cubic-bezier(.2,.8,.2,1); }

  /* ---------- background ---------- */
  .orb { position: absolute; border-radius: 50%; filter: blur(110px); }
  .orb.a { width: 620px; height: 620px; left: 520px; top: -260px; background: var(--red); opacity: .22; animation: drift-a 7s ease-in-out infinite; }
  .orb.b { width: 460px; height: 460px; left: -180px; top: 300px; background: var(--burgundy); opacity: .25; animation: drift-b 7s ease-in-out infinite; }
  @keyframes drift-a { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-60px, 40px) } }
  @keyframes drift-b { 0%,100% { transform: translate(0,0) } 50% { transform: translate(70px,-30px) } }
  .grid {
    position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse at 70% 40%, #000 0%, transparent 70%);
  }
  .streaks { position: absolute; inset: 0; }
  .streak { position: absolute; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(255,77,125,.55), transparent); }

  /* ---------- header ---------- */
  .brand { position: absolute; left: 64px; top: 44px; display: flex; align-items: center; gap: 14px; animation-name: pop; animation-duration: .6s; }
  .brand img { width: 52px; height: 52px; border-radius: 50%; box-shadow: 0 0 30px rgba(199,37,84,.45); }
  .brand span { font-family: 'Bebas Neue'; font-size: 30px; letter-spacing: 3px; }
  .url { position: absolute; right: 64px; top: 58px; font-family: 'Geist Mono', monospace; font-size: 17px; color: var(--muted); animation-name: fade-in; animation-duration: .6s; animation-delay: .3s; }
  .url b { color: var(--red); font-weight: 500; }

  /* ---------- copy ---------- */
  .copy { position: absolute; left: 64px; top: 128px; width: 640px; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px;
    background: linear-gradient(135deg, rgba(199,37,84,.18), rgba(139,21,56,.1)); border: 1px solid rgba(199,37,84,.35);
    font-size: 15px; font-weight: 600; letter-spacing: .5px; color: var(--pink);
    animation-name: slide-up; animation-duration: .6s; animation-delay: .2s;
  }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 0 rgba(199,37,84,.7); animation: ping 1.4s ease-out 5 both; animation-delay: .4s; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(199,37,84,.8) } 100% { box-shadow: 0 0 0 12px rgba(199,37,84,0) } }
  h1 { margin-top: 22px; font-family: 'Bebas Neue'; font-weight: 400; font-size: 132px; line-height: .9; letter-spacing: -1px; }
  h1 .l { display: block; transform-origin: left center; }
  h1 .l1 { animation-name: slam; animation-duration: .55s; animation-delay: .45s; }
  h1 .l2 {
    animation-name: slam; animation-duration: .55s; animation-delay: .75s;
    background: linear-gradient(90deg, var(--red), var(--pink), var(--red)); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { margin-top: 20px; font-size: 25px; line-height: 1.35; color: var(--muted); max-width: 560px; animation-name: slide-up; animation-duration: .6s; animation-delay: 1.05s; }
  .tagline b { color: var(--text); font-weight: 600; }

  /* ---------- ring ---------- */
  .ring-wrap { position: absolute; left: 790px; top: 118px; width: 300px; height: 300px; animation-name: pop; animation-duration: .7s; animation-delay: .6s; }
  .ring-glow { position: absolute; inset: 30px; border-radius: 50%; background: var(--red); filter: blur(60px); opacity: .25; }
  .ring-wrap svg { position: absolute; inset: 0; transform: rotate(-90deg); overflow: visible; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .count { font-family: 'Bebas Neue'; font-size: 104px; line-height: .85; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .of { margin-top: 6px; font-size: 17px; font-weight: 600; letter-spacing: 3px; color: var(--muted); }
  .runner { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px rgba(255,77,125,.45), 0 0 26px 6px rgba(255,77,125,.8); }
  .done-badge {
    position: absolute; left: 50%; top: -18px; transform: translateX(-50%); white-space: nowrap;
    padding: 8px 16px; border-radius: 999px; background: linear-gradient(135deg, var(--red), var(--burgundy));
    font-family: 'Bebas Neue'; font-size: 22px; letter-spacing: 2px; box-shadow: 0 10px 30px rgba(199,37,84,.55);
    animation-name: badge-in; animation-duration: .5s; animation-delay: 4.05s;
  }
  .flash { position: absolute; inset: -10px; border-radius: 50%; border: 6px solid var(--pink); animation: flash .9s ease-out 4s both; }
  @keyframes flash { 0% { transform: scale(.9); opacity: 0 } 15% { opacity: 1 } 100% { transform: scale(1.45); opacity: 0 } }
  @keyframes badge-in { 0% { transform: translateX(-50%) translateY(14px) scale(.6); opacity: 0 } 70% { transform: translateX(-50%) translateY(-3px) scale(1.08); opacity: 1 } 100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1 } }

  /* ---------- streak card ---------- */
  .streak-card {
    position: absolute; left: 770px; top: 448px; width: 340px; height: 82px; padding: 0 22px; border-radius: 22px;
    display: flex; align-items: center; gap: 16px;
    background: linear-gradient(135deg, rgba(26,26,26,.85), rgba(37,37,37,.55)); border: 1px solid rgba(255,255,255,.09);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 60px -10px rgba(0,0,0,.6);
    animation-name: slide-up; animation-duration: .6s; animation-delay: .95s;
  }
  .flame { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,140,40,.14); animation: flame-bounce .7s cubic-bezier(.3,1.6,.5,1) 4.1s both; }
  .flame svg { width: 26px; height: 26px; }
  @keyframes flame-bounce { 0% { transform: scale(1) } 40% { transform: scale(1.45) rotate(-8deg); background: rgba(255,140,40,.35) } 100% { transform: scale(1) } }
  .streak-num { position: relative; height: 50px; width: 84px; overflow: hidden; font-family: 'Bebas Neue'; font-size: 52px; line-height: 50px; }
  .streak-num span { position: absolute; left: 0; top: 0; }
  .streak-num .old { animation: roll-out .45s cubic-bezier(.6,0,.4,1) 4.1s both; }
  .streak-num .new { color: #ffb347; animation: roll-in .45s cubic-bezier(.6,0,.4,1) 4.1s both; }
  @keyframes roll-out { to { transform: translateY(-100%); opacity: 0 } }
  @keyframes roll-in { from { transform: translateY(100%); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
  .streak-label { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: var(--muted); line-height: 1.4; white-space: nowrap; }
  .streak-label em { display: block; font-style: normal; color: #ffb347; font-size: 13px; letter-spacing: 1.5px; }

  /* ---------- marquee ---------- */
  .marquee { position: absolute; left: 0; right: 0; bottom: 0; height: 54px; background: #111; border-top: 1px solid rgba(51,51,51,.6); overflow: hidden; display: flex; align-items: center; }
  .marquee::before, .marquee::after { content: ''; position: absolute; top: 0; bottom: 0; width: 120px; z-index: 2; }
  .marquee::before { left: 0; background: linear-gradient(90deg, #111, transparent); }
  .marquee::after { right: 0; background: linear-gradient(-90deg, #111, transparent); }
  .track { display: flex; width: max-content; }
  .track span { display: flex; align-items: center; gap: 18px; padding: 0 30px; font-family: 'Bebas Neue'; font-size: 21px; letter-spacing: 3px; color: #707070; white-space: nowrap; }
  .track span::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }

  .confetti { position: absolute; inset: 0; pointer-events: none; }
  .confetti i { position: absolute; display: block; border-radius: 2px; }

  /* Fade to black at the end of the timeline so the loop restarts seamlessly. */
  .fade { position: absolute; inset: 0; background: var(--bg); pointer-events: none; animation: fade-out .7s ease-in 6.3s both; }
  @keyframes fade-out { from { opacity: 0 } to { opacity: 1 } }

  @keyframes pop { 0% { transform: scale(.4); opacity: 0 } 65% { transform: scale(1.06); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
  @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slide-up { from { transform: translateY(26px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
  @keyframes slam { 0% { transform: scale(1.6) translateX(-20px); opacity: 0; filter: blur(12px) } 60% { transform: scale(.97); opacity: 1; filter: blur(0) } 100% { transform: scale(1); opacity: 1; filter: blur(0) } }
</style>
</head>
<body>
<div class="stage">
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="grid"></div>
  <div class="streaks" id="streaks"></div>

  <div class="brand anim"><img src="../../public/images/mad-circle-icon.png" alt="" /><span>MILE A DAY</span></div>
  <div class="url anim" id="url"></div>

  <div class="copy">
    <div class="pill anim"><i></i><span id="eyebrow"></span></div>
    <h1><span class="l l1 anim" id="line1"></span><span class="l l2 anim" id="line2"></span></h1>
    <p class="tagline anim" id="tagline"></p>
  </div>

  <div class="ring-wrap anim">
    <div class="ring-glow" id="ringGlow"></div>
    <svg viewBox="0 0 300 300" width="300" height="300">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff4d7d" />
          <stop offset="1" stop-color="#c72554" />
        </linearGradient>
      </defs>
      <circle cx="150" cy="150" r="130" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="18" />
      <circle id="arc" cx="150" cy="150" r="130" fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round" />
    </svg>
    <div class="runner" id="runner"></div>
    <div class="ring-center">
      <div class="count" id="count">0.00</div>
      <div class="of">OF 1.0 MI</div>
    </div>
    <div class="flash"></div>
    <div class="done-badge anim">✓ MILE COMPLETE</div>
  </div>

  <div class="streak-card anim">
    <div class="flame">
      <svg viewBox="0 0 24 24" fill="#ff9a3c"><path d="M12 2c.6 3.2-1 5-2.6 6.8C7.8 10.6 6 12.6 6 15.5A6 6 0 0 0 12 22a6 6 0 0 0 6-6.2c0-2.6-1.3-4.4-2.4-5.6-.2 1.6-.9 2.8-2 3.4.4-3.6-.4-8.2-1.6-11.6Z"/></svg>
    </div>
    <div class="streak-num"><span class="old" id="streakOld"></span><span class="new" id="streakNew"></span></div>
    <div class="streak-label">DAY STREAK<em id="streakNote">KEEP IT ALIVE</em></div>
  </div>

  <div class="confetti" id="confetti"></div>

  <div class="marquee"><div class="track" id="track"></div></div>
  <div class="fade"></div>
</div>

<script>
  const DURATION = 7
  const params = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'))
  const cfg = Object.assign({
    eyebrow: 'Available on iOS & Apple Watch',
    line1: 'ONE MILE.',
    line2: 'EVERY DAY.',
    tagline: 'Walk it or run it. <b>Just get it done.</b>',
    url: 'mileaday.run',
    path: '',
    streak: 288,
    marquee: ['START YOUR MILE', 'BUILD YOUR STREAK', 'GO THE EXTRA MILE', 'NO EXCUSES', 'COMPETE WITH FRIENDS', 'GET MAD', 'WALK IT OR RUN IT', '66 DAYS TO A HABIT'],
  }, params)

  document.getElementById('eyebrow').textContent = cfg.eyebrow
  document.getElementById('line1').textContent = cfg.line1
  document.getElementById('line2').textContent = cfg.line2
  document.getElementById('tagline').innerHTML = cfg.tagline
  document.getElementById('url').innerHTML = cfg.url + (cfg.path ? `<b>${cfg.path}</b>` : '')
  document.getElementById('streakOld').textContent = cfg.streak - 1
  document.getElementById('streakNew').textContent = cfg.streak

  // Marquee: two identical sets, scrolled by exactly one set width per loop.
  const track = document.getElementById('track')
  const set = cfg.marquee.map(t => `<span>${t}</span>`).join('')
  track.innerHTML = set + set + set

  // Seeded RNG so every render is identical.
  let seed = 7
  const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646

  // Speed streaks drifting right-to-left; periods divide DURATION so they loop.
  const streaks = document.getElementById('streaks')
  for (let i = 0; i < 14; i++) {
    const el = document.createElement('div')
    el.className = 'streak'
    const w = 120 + rand() * 260
    el.style.width = w + 'px'
    el.style.top = (40 + rand() * 520) + 'px'
    el.style.opacity = (0.25 + rand() * 0.5).toFixed(2)
    streaks.appendChild(el)
    const period = DURATION / (1 + Math.floor(rand() * 3))
    el.animate(
      [{ transform: `translateX(${1200 + w}px)` }, { transform: `translateX(${-w * 2}px)` }],
      { duration: period * 1000, iterations: Infinity, delay: -rand() * period * 1000 },
    )
  }

  // Confetti burst from the ring when the mile completes.
  const confetti = document.getElementById('confetti')
  const colors = ['#c72554', '#ff4d7d', '#ffb347', '#f5f5f5', '#8b1538', '#ff9a3c']
  for (let i = 0; i < 90; i++) {
    const el = document.createElement('i')
    const w = 6 + rand() * 8
    el.style.width = w + 'px'
    el.style.height = (rand() > 0.5 ? w : w * 0.45) + 'px'
    el.style.background = colors[i % colors.length]
    el.style.left = '940px'
    el.style.top = '268px'
    confetti.appendChild(el)
    const angle = rand() * Math.PI * 2
    const speed = 160 + rand() * 340
    const dx = Math.cos(angle) * speed
    const dy = Math.sin(angle) * speed - 120
    const rot = (rand() - 0.5) * 1440
    el.animate(
      [
        { transform: 'translate(0,0) rotate(0) scale(.3)', opacity: 0 },
        { transform: `translate(${dx * 0.55}px, ${dy * 0.55}px) rotate(${rot * 0.4}deg) scale(1)`, opacity: 1, offset: 0.25 },
        { transform: `translate(${dx}px, ${dy + 420}px) rotate(${rot}deg) scale(.9)`, opacity: 0 },
      ],
      { duration: 1700 + rand() * 900, delay: 4000 + rand() * 120, fill: 'both', easing: 'cubic-bezier(.15,.7,.4,1)' },
    )
  }

  const arc = document.getElementById('arc')
  const runner = document.getElementById('runner')
  const count = document.getElementById('count')
  const ringGlow = document.getElementById('ringGlow')
  const line2 = document.getElementById('line2')
  const streakNote = document.getElementById('streakNote')
  const C = 2 * Math.PI * 130
  arc.style.strokeDasharray = C

  const clamp = (x) => Math.min(1, Math.max(0, x))
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)

  window.__ready = (async () => {
    await document.fonts.ready
    await Promise.all([...document.images].map(img => img.decode().catch(() => {})))
    const setWidth = track.scrollWidth / 3
    track.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${-setWidth}px)` }], { duration: DURATION * 1000, iterations: Infinity })
    line2.animate([{ backgroundPosition: '200% 0' }, { backgroundPosition: '0% 0' }], { duration: DURATION * 1000 / 2, iterations: Infinity })
  })()

  // Seek the whole scene to time t (seconds).
  window.__seek = (t) => {
    for (const a of document.getAnimations()) {
      a.pause()
      a.currentTime = t * 1000
    }
    const p = ease(clamp((t - 1.0) / 3.0))
    arc.style.strokeDashoffset = C * (1 - p)
    arc.style.opacity = p > 0.002 ? 1 : 0
    const theta = (p * 360 - 90) * Math.PI / 180
    runner.style.left = (150 + Math.cos(theta) * 130) + 'px'
    runner.style.top = (150 + Math.sin(theta) * 130) + 'px'
    runner.style.opacity = t < 0.9 ? 0 : clamp((4.15 - t) / 0.2)
    streakNote.textContent = t < 4.1 ? 'KEEP IT ALIVE' : '+1 TODAY'
    count.textContent = p.toFixed(2)
    count.style.color = p >= 1 ? '#ff4d7d' : '#f5f5f5'
    ringGlow.style.opacity = (0.2 + 0.35 * p + (t > 4 ? 0.15 * Math.sin((t - 4) * 4) ** 2 : 0)).toFixed(3)
  }
  window.__duration = DURATION
</script>
</body>
</html>
